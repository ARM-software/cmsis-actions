name: 'Setup vcpkg'
description: 'Install Microsoft`s vcpkg management tool'
author: 'Jonatan Antoni <jonatan.antoni@arm.com>'

inputs:
  version:
    description: The version of vcpkg to install.
    default: "2026.04.27"
    required: false

runs:
  using: 'composite'
  steps:
    - name: Clone vcpkg
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: microsoft/vcpkg
        path: .vcpkg
        ref: ${{ inputs.version }}

    - name: Get required Node.js version
      id: get_node_version
      if: steps.vcpkg.outputs.install != 0
      shell: bash
      run: |
        node_version=$(grep -A 5 '"name": "node"' "${{ github.workspace }}/.vcpkg/scripts/vcpkg-tools.json" | grep '"version"' | head -n1 | sed 's/[^0-9.]*\([0-9.]*\).*/\1/')
        echo "node_version=$node_version" >> $GITHUB_OUTPUT

    - uses: actions/setup-node@v6
      if: steps.vcpkg.outputs.install != 0
      with:
        node-version: ${{ steps.get_node_version.outputs.node_version }}

    - name: Bootstrap vcpkg [Windows]
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        call ${{ github.workspace }}\.vcpkg\bootstrap-vcpkg.bat
        echo ${{ github.workspace }}\.vcpkg >> %GITHUB_PATH%

    - name: Check vcpkg installation [Windows]
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        where vcpkg
        vcpkg version

    - name: Bootstrap vcpkg [Linux/Mac]
      if: runner.os != 'Windows'
      shell: bash
      run: |
        ${{ github.workspace }}/.vcpkg/bootstrap-vcpkg.sh
        echo ${{ github.workspace }}/.vcpkg >> $GITHUB_PATH

    - name: Check vcpkg installation [Linux/Mac]
      if: runner.os != 'Windows'
      shell: bash
      run: |
        which vcpkg
        vcpkg version
