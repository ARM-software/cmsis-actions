on: 
  pull_request: 
    branches: [main]
    paths:
      - setup-vcpkg/*
      - vcpkg/*
      - .github/workflows/vcpkg-action.yml
  push:
    branches: [main]
    paths:
      - setup-vcpkg/*
      - vcpkg/*
      - .github/workflows/vcpkg-action.yml
  workflow_dispatch:

jobs:
  test:
    name: Test vcpkg action
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
          - windows-11-arm
          - windows-11-vs2026-arm
          - ubuntu-24.04
          - ubuntu-26.04
          - ubuntu-24.04-arm
          - ubuntu-26.04-arm
          - ubuntu-slim
          - macos-15-intel
          - macos-26-intel
          - macos-15
          - macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup vcpkg
        uses: ./setup-vcpkg

      - name: Activate vcpkg environment
        uses: ./vcpkg
        with:
          config: ./vcpkg/vcpkg-configuration.json
          cache: -${{ matrix.os }}

      - name: Verify some tools
        run: |
          which cpackget
          which cbuild
